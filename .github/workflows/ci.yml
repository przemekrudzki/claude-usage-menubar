name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    # The SwiftUI target needs Swift 6.2+ isolation inference and the macOS 26
    # SDK; older runners (macos-14 ships Xcode 15.4 / Swift 5.10) can't build it.
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build
      - name: Test
        run: swift run ClaudeUsageCoreTests
